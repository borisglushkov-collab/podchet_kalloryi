name: Deploy backend to VPS

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub release tag (e.g. v1.4.48-backend)
        required: true
        default: v1.4.48-backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: startsWith(github.event.release.tag_name || inputs.tag, 'v') && contains(github.event.release.tag_name || inputs.tag, '-backend')
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER || 'root' }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          password: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          script_stop: true
          script: |
            set -euo pipefail
            TAG="${{ github.event.release.tag_name || inputs.tag }}"
            curl -fsSL -o /tmp/update-from-github.sh \
              https://raw.githubusercontent.com/borisglushkov-collab/podchet_kalloryi/main/backend/deploy/update-from-github.sh
            sed -i 's/\r$//' /tmp/update-from-github.sh
            bash /tmp/update-from-github.sh "${TAG}"
            systemctl restart podchet-kalloriy
            sleep 2
            curl -sS http://127.0.0.1/health
            cat /opt/podchet_kalloriy/backend/VERSION
