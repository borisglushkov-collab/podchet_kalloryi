<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>B · Ocean Track — Сбор для коуча</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Source+Sans+3:wght@500;600;700&display=swap" />
  <style>
    :root {
      --brand: #0e7490;
      --ink: #0f1720;
      --muted: #5b6b7a;
      --line: rgba(15,23,32,.08);
      --surface: #ffffff;
      --panel: #eef4f8;
      --accent: #0891b2;
      --warn: #c2410c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Source Sans 3", system-ui, sans-serif;
      color: var(--ink);
      background:
        linear-gradient(180deg, #dbe7f0 0%, #f2f6f9 32%, #eef3f7 100%);
      padding: 14px 14px 92px;
    }
    .bar {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 12px; font-size: 13px; font-weight: 700; color: var(--muted);
    }
    .bar a { color: var(--brand); text-decoration: none; font-family: "Space Grotesk", sans-serif; }
    .top {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: end;
      margin-bottom: 14px;
      animation: slide .55s ease both;
    }
    .brand {
      font-family: "Space Grotesk", sans-serif;
      font-size: 34px;
      font-weight: 700;
      margin: 0;
      letter-spacing: -0.04em;
      color: var(--ink);
    }
    .tag {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }
    .sync {
      text-align: right;
      font-family: "Space Grotesk", sans-serif;
      font-size: 12px;
      font-weight: 700;
      color: var(--brand);
      background: rgba(8,145,178,.1);
      border-radius: 12px;
      padding: 10px 12px;
    }
    .strip {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 12px;
      animation: slide .55s ease .05s both;
    }
    .kpi {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 12px 10px;
      min-height: 86px;
    }
    .kpi .l {
      font-size: 10px; text-transform: uppercase; letter-spacing: .06em;
      color: var(--muted); font-weight: 700; margin-bottom: 6px;
    }
    .kpi .v {
      font-family: "Space Grotesk", sans-serif;
      font-size: 20px; font-weight: 700; letter-spacing: -0.03em;
    }
    .kpi .s { margin-top: 4px; font-size: 11px; color: var(--muted); font-weight: 600; }
    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 14px;
      margin-bottom: 10px;
      animation: slide .55s ease .1s both;
    }
    .panel h2 {
      margin: 0 0 10px;
      font-family: "Space Grotesk", sans-serif;
      font-size: 14px;
      letter-spacing: -0.02em;
    }
    .food-head {
      display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
    }
    .kcal {
      font-family: "Space Grotesk", sans-serif;
      font-size: 32px; font-weight: 700; letter-spacing: -0.04em;
    }
    .bars {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0;
    }
    .bars .b {
      background: var(--panel); border-radius: 12px; padding: 10px;
      font-size: 12px; font-weight: 700;
    }
    .bars strong { display: block; font-family: "Space Grotesk", sans-serif; font-size: 16px; margin-top: 2px; }
    .list { list-style: none; margin: 0; padding: 0; }
    .list li {
      display: flex; justify-content: space-between; gap: 8px;
      padding: 10px 0; border-top: 1px solid var(--line); font-size: 14px; font-weight: 600;
    }
    .cta {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px;
    }
    .btn {
      border: 0; border-radius: 12px; padding: 13px 12px;
      font-family: "Space Grotesk", sans-serif; font-weight: 700; cursor: pointer;
    }
    .btn.primary { background: var(--brand); color: white; }
    .btn.ghost { background: var(--panel); color: var(--ink); }
    .tabs {
      position: fixed; left: 0; right: 0; bottom: 0;
      display: grid; grid-template-columns: repeat(5, 1fr);
      background: rgba(255,255,255,.92); backdrop-filter: blur(10px);
      border-top: 1px solid var(--line);
      padding: 8px 6px calc(8px + env(safe-area-inset-bottom));
    }
    .tabs span {
      text-align: center; padding: 10px 2px; font-size: 11px; font-weight: 700; color: var(--muted);
      font-family: "Space Grotesk", sans-serif;
    }
    .tabs .on { color: var(--brand); position: relative; }
    .tabs .on::after {
      content: ""; position: absolute; left: 28%; right: 28%; bottom: 4px; height: 3px;
      border-radius: 99px; background: var(--accent);
    }
    @keyframes slide {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <div class="bar">
    <a href="index.html">← варианты</a>
    <span>B · Ocean Track</span>
  </div>

  <header class="top">
    <div>
      <h1 class="brand">Сбор</h1>
      <p class="tag">Трекер дня · 20.08.2026</p>
    </div>
    <div class="sync">синхр.<br>15:41</div>
  </header>

  <section class="strip">
    <div class="kpi"><div class="l">АД</div><div class="v">131/89</div><div class="s">7д 133/90</div></div>
    <div class="kpi"><div class="l">Сон</div><div class="v">6:30</div><div class="s">REM 80м</div></div>
    <div class="kpi"><div class="l">Шаги</div><div class="v">3315</div><div class="s">Mi</div></div>
    <div class="kpi"><div class="l">Вес</div><div class="v">109.0</div><div class="s">S400</div></div>
  </section>

  <section class="panel">
    <div class="food-head">
      <h2>Еда · FatSecret</h2>
      <div class="kcal">830</div>
    </div>
    <div class="bars">
      <div class="b">Белок<strong>42</strong></div>
      <div class="b">Жир<strong>28</strong></div>
      <div class="b">Углев.<strong>78</strong></div>
    </div>
    <ul class="list">
      <li><span>Завтрак · омлет</span><span>196</span></li>
      <li><span>Обед · блин</span><span>350</span></li>
      <li><span>Ужин · 3 позиции</span><span>284</span></li>
    </ul>
    <div class="cta">
      <button class="btn primary">Обновить данные</button>
      <button class="btn ghost">Копировать отчёт</button>
    </div>
  </section>

  <nav class="tabs">
    <span class="on">Сегодня</span>
    <span>Неделя</span>
    <span>Добавить</span>
    <span>Коучу</span>
    <span>Ещё</span>
  </nav>
</body>
</html>
